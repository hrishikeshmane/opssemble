[project]
name = "opssemble-monitoring"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastmcp==3.4.7",
  "httpx>=0.28,<1",
  "starlette>=1.0.1,<2",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
