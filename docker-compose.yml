services:
  monitoring:
    build: .
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"

  prometheus:
    image: prom/prometheus:v3.13.2
    profiles: ["prometheus"]
    depends_on:
      monitoring:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
